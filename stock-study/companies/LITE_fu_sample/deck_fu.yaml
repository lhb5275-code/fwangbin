# F/U(실적 리뷰) 양식 확인용 샘플: '루멘텀 2026-3분기' 예시 덱의 문장 일부 + 실제 데이터.
# 사진은 무료 이미지(위키미디어)로 대신했다. 실제 덱에서는
#   - 4번(실적발표 자료 표지), 끝 장(IR 마지막 장)은 회사 IR PDF에서 꺼낸 이미지
#   - 6번 인용문 슬라이드는 CEO 사진
# 을 쓴다 (STYLE_FU.md 참고).
company: 루멘텀
ticker: LITE
logo: img/logo.png               # 제목 탭 로고 (밝은 배경용)
logo_small: img/logo_white.png   # 표지 오른쪽 아래 작은 로고 (어두운 배경용)
data: data/data.json
deck_title: 루멘텀 2026-3분기 실적 리뷰
output: LITE_fu_sample_실적리뷰.pptx

slides:
  - type: fu_cover
    image: img/server_room.jpg
    hook: "[[$1,300]] 간다?"
    notes: |
      오늘은 2026년 5월에 발표된 루멘텀의
      3분기 실적을 정리해드리겠습니다.

  - title: 지난 분석
    lines:
      - "3달 전 2분기 실적 리뷰 (2026.02.04) 당시 주가 [[$465.54]]"
    chart:
      categories: ["지난 분석 (2/4)", "현재 (5/8)"]
      values: [465.54, 903.80]
      labels: ["$465.54", "$903.80"]
      top_labels: ["", "+94%"]
      highlight: [1]
    source: "Yahoo Finance 종가"
    notes: |
      3달 전에 2분기 실적을 분석했는데
      그때 주가가 465달러였습니다.

  - title: 주가 흐름
    chart: {source: price_1y, until: "2026-05-08", market_cap: 70000000000}
    date: "2026-05-08"
    source: "Yahoo Finance"
    notes: |
      2026년 5월 8일 기준
      주가는 900달러이고
      시가총액은 700억 달러 수준입니다.

  - type: full_image
    image: img/building.jpg
    notes: |
      1년동안 주가가 무려
      14배나 올랐는데
      그 이유가 뭘까요?

  - title: 2026-3분기 실적
    lines:
      - "매출:  [[$808M]]                    (가이던스 $780-830M {{충족}})"
      - "Non-GAAP 희석 EPS:  [[$2.37]]   (가이던스 $2.15-2.35 {{상회}})"
    chart: {source: quarterly.revenue, n: 5, until: "2026-03-31", font_size: 16}
    source: "Lumentum Q3 FY26 실적발표, SEC 10-Q"
    notes: |
      3분기 매출은 8억 8백만 달러를 기록해
      가이던스를 충족했고,
      논갭 기준 희석 EPS는 2.37 달러를 기록해
      가이던스를 소폭 상회했습니다.

  - type: quote
    image: img/building.jpg
    quote:
      - "3분기 마진 확대는 주로"
      - "scale-out 포트폴리오가 주도했지만,"
      - "앞으로 [[scale-across]] 제품군을"
      - "주목해야 한다."
    by: "Lumentum CEO, Q3 FY26 어닝콜"
    notes: |
      3분기 마진 확대는 주로
      Scale-out 포트폴리오가 주도했지만
      앞으로 scale-across 제품군을
      주목해야 한다.
      어닝콜 초반에 루멘텀 CEO가 한 말입니다.

  - title: Scale-across
    lines:
      - "펌프 레이저"
    image: img/fiber_connectors.jpg
    notes: |
      루멘텀의 펌프 레이저는
      4개, 8개 또는 16개의 광섬유 쌍에 걸쳐
      동시에 광신호를 증폭합니다.

  - title: Scale-across
    lines:
      - "Multi-rail 기술"
    image: img/fiber_cable.jpg
    notes: |
      앞으로는 차세대 멀티레일 기술이
      스케일 어크로스 네트워크가 요구하는
      높은 병렬성을 충족하는데
      핵심적인 역할을 수행할 것입니다.

  - title: 2026-3분기 사업성과
    lines:
      - "[[부품]] 사업:"
      - "- 매출:  [[$5.3억]]  (QoQ {{+20%}}, YoY {{+77%}})"
      - "- 펌프 레이저:  YoY {{+80%}}"
      - "- 협대역 선폭 레이저:  9분기 연속 성장,  YoY {{+120%}}"
      - "- 레이저 칩:  EML 출하량 역대 최고치  (200G 매출:  QoQ {{+100%}})"
      - ""
      - "[[시스템]] 사업:"
      - "- 매출:  [[$2.8억]]  (QoQ {{+24%}}, YoY {{+121%}})"
      - "- 클라우드 트랜시버:  QoQ {{+40%}}  (4분기부터 1.6T 제품 양산 예정)"
      - "- OCS:  최근 $수십억 규모 다년 계약 체결  (그러나 [[공급 << 수요]])"
    source: "Lumentum Q3 FY26 어닝콜"
    notes: |
      이제 사업별 성과를 살펴보겠습니다.
      부품 사업의 경우
      5.3억 달러 매출을 기록해
      직전분기대비 20%, 전년동기대비 77% 성장했습니다.
      시스템 사업의 경우
      2.8억 달러 매출을 기록해
      직전분기대비 24%, 전년동기대비 121% 성장했습니다.

  - title: 2026-3분기 손익계산서
    layout: right
    text_width: 7.0
    lines:
      - "총매출:  [[$8.1억]]  (YoY {{+90%}})"
      - "매출총이익:  [[$3.6억]]  (YoY {{+191%}})"
      - "- 매출총이익률:  [[44.2%]]  (YoY {{+15.4%p}})"
      - "영업이익:  [[$1.7억]]  (YoY {{흑자전환}})"
      - "- R&D 비용:  $0.9억  (YoY {{+19%}})"
      - "당기순이익:  [[$1.4억]]  (YoY {{흑자전환}})"
      - "희석 EPS:  [[$1.50]]  (1년 전:  -$0.64)"
    table:
      style: statement
      font_size: 11
      header: ["(단위: 백만 달러)", "3Q FY25", "3Q FY26"]
      rows:
        - ["Net revenue", "425.2", "[[808.4]]"]
        - ["Gross profit", "122.5", "[[357.0]]"]
        - ["Research and development", "75.9", "90.6"]
        - ["Income (loss) from operations", "(37.7)", "[[174.5]]"]
        - ["Net income (loss)", "(44.1)", "[[144.2]]"]
        - ["Diluted EPS ($)", "(0.64)", "[[1.50]]"]
    source: "Lumentum Q3 FY26 10-Q (SEC XBRL)"
    notes: |
      이제 손익계산서를 보겠습니다.
      3분기 매출은 8.1억 달러를 기록해
      전년대비 90% 폭증했습니다.
      매출총이익은 190% 폭증해 3.6억 달러를 기록했고
      그로스마진은 무려 44%를 기록했습니다.
      영업이익은 1.7억 달러를 기록해 흑자로 돌아섰습니다.

  - type: guidance
    title: 2026-4분기 가이던스
    quarters: ["25-4Q", "26-1Q", "26-2Q", "26-3Q", "26-4Q"]
    revenue: [481, 534, 666, 808, 985]
    revenue_labels: ["$481M", "$534M", "$666M", "$808M", "$960-1,010M"]
    growth: ["+11%", "+25%", "+21%", "+22%"]
    margin: ["15%", "18.7%", "25.2%", "32.2%", "35-36%"]
    eps: ["$0.88", "$1.1", "$1.67", "$2.37", "$2.85-\n3.05"]
    source: "Lumentum 분기 실적발표 (Non-GAAP)"
    notes: |
      다가오는 4분기 매출은
      직전분기대비 22% 성장한 9.6억 에서
      10.1억 달러를 전망했습니다.
      최근 네 분기동안의 매출 성장률을 비교해보면
      +11%, +25%, +21% 에 이어 +22%입니다.
      영업이익률과 논갭 희석 EPS 역시
      네 분기 연속 증가할 것으로 예상합니다.

  - type: section
    text: "Q & A"
    notes: |
      어닝콜 후 경영진과 애널리스트 간에 Q&A가 있었습니다.
      주요 문답을 정리해드리겠습니다.

  - type: qa
    q: "EML과 레이저의 [[수요]]는 문제가 없는 것 같은데, [[공급]] 현황은 어떤가요?"
    a:
      - "지난 분기에 연간 50% 공급 증가를 목표로 제시했듯이 공급을 꾸준히 늘리고 있지만,"
      - "여전히 {{수요를 따라가지 못하고}} 있습니다."
      - "지난 어닝콜 때 수급 불균형이 25% 수준이라고 말했는데, 현재는 {{30% 이상}}입니다."
    source: "Lumentum Q3 FY26 어닝콜"
    notes: |
      첫번째 질문은 레이저 공급 현황이었습니다.
      경영진은 수급 불균형이 25%에서 30% 이상으로
      오히려 커졌다고 답했습니다.

  - title: 목표주가
    date: "2026-05-10"
    lines:
      - "애널리스트 [[17명]]:  매수 13 · 중립 4 · 매도 0"
      - "평균 목표주가 [[$1,064]]  (현재가 대비 {{+17%}})"
    chart:
      categories: ["매수", "중립", "매도"]
      values: [13, 4, 0]
      labels: ["13명", "4명", "0명"]
      highlight: [0]
    source: "TipRanks (2026.5.10, 예시 덱 기준)"
    notes: |
      목표주가는 얼마일까요?
      17명의 애널리스트 중 13명이 매수 의견
      그리고 4명이 중립 의견을 제시했습니다.
      12개월 뒤 평균목표주가는 1,064달러이고
      현재 주가보다 17% 높습니다.

  - title: 밸류에이션
    date: "2026-05-10"
    table:
      style: statement
      font_size: 20
      row_height: 0.7
      width: 8
      header: ["지표", "값"]
      rows:
        - ["Trailing P/E", "159배"]
        - ["Forward P/E", "[[59배]]"]
        - ["P/S", "30배"]
        - ["P/B", "23배"]
    source: "Yahoo Finance (2026.5.10, 예시 덱 기준)"
    notes: |
      밸류에이션을 보겠습니다.
      루멘텀의 트레일링 PER은 159,
      포워드 PER은 무려 59입니다.
      절대 싸다고 말할 수 없는 가격입니다.

  - title: 총정리
    lines:
      - "3분기 실적:  ( ((부분적))인 ) 어닝 ((서프라이즈))"
      - "- 매출:  $8.1억  (QoQ [[+21%]].  가이던스 {{충족}})"
      - "- Non-GAAP 영업이익률:  32.2%  (QoQ [[+7%p]].  가이던스 {{상회}})"
      - "- Non-GAAP 희석 EPS:  $2.37  (QoQ [[+42%]].  가이던스 {{상회}})"
      - ""
      - "[[엔비디아]], 루멘텀에 [[$20억]] 투자"
      - ""
      - "루멘텀, [[S&P 500]] 지수 편입"
    notes: |
      총정리를 해보겠습니다.
      3분기 실적은 부분적으로 어닝 서프라이즈였습니다.
      왜 부분적이냐면,
      논갭 영업이익률과 희석 EPS는 가이던스를 상회했지만
      매출이 가이던스 상단을 넘지 못했기 때문입니다.

  - title: 총정리
    lines:
      - "수요-공급 불균형:  [[30% 이상]]"
      - ""
      - "[[Scale-across]]의 비중이 아직 작은데, 천천히 지켜보자"
      - ""
      - "리스크:"
      - "- 상위 2개 고객사가 전체 매출의 [[38%]] 차지"
      - "- [[중국 경쟁사]]"
      - "- 높은 밸류에이션 (Forward PER [[59]])"
    notes: |
      이번 어닝콜 내용 중
      가장 인상깊었던 것은
      수요 공급 불균형이 지난 분기대비 심해져
      30% 이상까지 격차가 벌어졌다는 점입니다.
      다만 리스크가 전혀 없는 것은 아닙니다.
      현명한 투자하시길 바라겠습니다.

  - type: full_image
    image: img/server_room.jpg
    tab: "감사합니다"
    notes: |
      이상 루멘텀 홀딩스의 2026 회계연도
      3분기 실적 리뷰를 마치겠습니다.
      영상이 도움되셨다면 구독, 좋아요, 댓글 꼭 부탁드립니다.
      큰 힘이 됩니다. 감사합니다.
