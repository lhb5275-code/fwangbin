# 넥스트파워(NXT) 기업분석
# 자료: Q1 FY27 주주서한·10-Q(2026.7.3 분기), Q1 FY27 어닝콜 대본(2026.7.30), 2026 Proxy(DEF 14A),
#       SEC XBRL(fetch_data.py), Yahoo Finance 주가(2026.10.2 종가), StockAnalysis 컨센서스(2026.10.2), 위키백과
company: 넥스트파워
ticker: NXT
logo_text: NEXTPOWER
brand_color: E8501E
cover_image: img/tracker_field.jpg
data: data/data.json
output: NXT_기업분석.pptx

slides:
  - type: cover
    notes: 오늘 공부할 기업은 넥스트파워 입니다.

  - title: 주가 흐름
    chart: {source: price_1y}
    source: Yahoo Finance (2026.10.2 종가), 10-Q 표지 발행주식수
    notes: |
      넥스트파워 주가는 2026년 10월 2일 기준
      84.3달러에 거래되고 있고
      시가총액은 약 128억 달러입니다.
      (나)
      지난 5월 말 156달러까지 올랐다가
      넉 달 만에 절반 가까이 빠진 상태입니다.

  - title: 사업한줄평
    lines:
      - "유틸리티급 태양광 [[트래커]] 세계 1위 → 기초·eBOS·[[인버터]]·[[ESS]]까지 묶어 파는 에너지 인프라 플랫폼"
    image: img/tracker_field.jpg
    notes: |
      넥스트파워는 대형 태양광 발전소에 들어가는
      태양광 트래커, 즉 해를 따라 패널을 돌려주는 구조물을
      세계에서 가장 많이 파는 회사입니다.
      (나)
      최근에는 기초 구조물, 전기 설비, 인버터, 배터리까지
      발전소에 필요한 장비를 묶어서 공급하는
      에너지 인프라 플랫폼으로 변신하고 있습니다.

  - title: 트래커란?
    lines:
      - "태양을 따라 패널 각도를 바꾸는 구조물 → 발전량 증가"
      - "- 고정식 대비 단위 면적당 발전량 ↑, 대형 발전소의 표준"
    image: img/bifacial.jpg
    notes: |
      트래커가 뭔지 먼저 짚고 가겠습니다.
      고정식 태양광은 패널이 한 방향만 보고 있지만
      트래커는 아침부터 저녁까지 해를 따라 패널을 돌립니다.
      (나)
      그래서 같은 땅에서 더 많은 전기를 만들 수 있고
      미국 대형 발전소에서는 사실상 표준이 됐습니다.

  - title: 역사
    lines:
      - "(2013)  [[Dan Shugar]], Nextracker 창업"
    image: img/shugar.jpg
    source: 2026 Proxy Statement
    notes: |
      먼저 회사 역사를 설명드리겠습니다.
      2013년, 30년 가까이 태양광 업계에 몸담았던
      댄 슈가가 넥스트파워의 전신인 넥스트래커를 세웠습니다.

  - title: 역사
    lines:
      - "(2015)  [[Flex]](플렉스)가 $3.3억에 인수"
      - "(2016)  BrightBox 인수 → 발전량 최적화 소프트웨어 [[TrueCapture]] 개발"
    image: img/flex.png
    source: 위키백과, Q1 FY27 어닝콜
    notes: |
      2015년, 전자제품 위탁생산 기업 플렉스가
      넥스트래커를 3억 3천만 달러에 인수했습니다.
      (나)
      이듬해에는 머신러닝 회사 브라이트박스를 인수해
      트래커 한 줄 한 줄을 따로 제어하는
      트루캡처 소프트웨어를 만들었습니다.

  - title: 역사
    lines:
      - "(2023.02)  나스닥 상장 (티커 [[NXT]], $6.4억 조달)"
      - "(2024.01)  Flex가 보유 지분을 주주에게 분배 → [[완전 독립]]"
    image: img/handshake.jpg
    source: 위키백과, 2026 Proxy Statement
    notes: |
      2023년 2월, 나스닥에 상장했습니다.
      (나)
      그리고 2024년 1월, 플렉스가 보유 지분을
      자기 주주들에게 나눠주면서
      넥스트래커는 완전히 독립한 회사가 됐습니다.

  - title: 역사
    lines:
      - "(2024~25)  기초(Ojjo), eBOS(Bentek), 로보틱스(OnSight) 등 [[인수]]"
      - "(2025.11)  사명 변경 [[Nextracker → Nextpower]]"
      - "- '태양광 트래커'에서 '에너지 기술' 기업으로"
    image: img/engineer.jpg
    source: 10-Q, 위키백과
    notes: |
      이후 트래커 주변 제품들을 하나씩 인수했습니다.
      기초 구조물 회사 오죠, 전기 설비 회사 벤텍,
      로봇 시공 회사 온사이트 등입니다.
      (나)
      그리고 2025년 11월,
      트래커 회사라는 이름을 버리고
      넥스트파워로 사명을 바꿨습니다.

  - title: 역사
    lines:
      - "(2026.07)  ESS 기업 [[Prevalon]] 인수 완료 (최대 $3.65억)"
      - "(2026.07)  인버터 기업 Zigor/[[Apex]] 자산 인수 완료 (최대 $0.8억)"
      - "(인수 예정)  독일 [[Zimmermann]] PV-Steel"
    images: [img/bess_unit.jpg, img/inverter_pcs.jpg]
    source: 10-Q (후속 사건 주석), 주주서한
    notes: |
      올해 7월에는 굵직한 인수가 두 건 마무리됐습니다.
      배터리 에너지저장장치 회사 프레발론,
      그리고 인버터 회사 지고르와 에이펙스입니다.
      (나)
      독일의 고정식 구조물 회사
      짐머만 인수도 진행 중입니다.

  - title: 시장 지위
    lines:
      - "트래커 시장 점유율 [[11년 연속 1위]] (Wood Mackenzie, 2025)"
      - "- 미국 [[55%]], 전 세계 [[30%]]"
      - "누적 약 2,000개 프로젝트, [[160GW]] 이상, 50개국 이상"
    image: img/solar_storage.jpg
    source: Q1 FY27 주주서한
    notes: |
      넥스트파워는 우드맥킨지 조사에서
      11년 연속 트래커 점유율 1위를 차지했습니다.
      (나)
      미국에서는 55%, 전 세계에서는 30%입니다.
      (나)
      지금까지 약 2천 개 프로젝트,
      160기가와트가 넘는 발전소에 장비를 공급했습니다.

  - title: CEO
    layout: left
    media_width: 4.0
    image: img/shugar.jpg
    lines:
      - "[[Dan Shugar]]  (63세, 창업자)"
      - ""
      - "RPI 전기전자공학 학사"
      - "Golden Gate University MBA"
      - ""
      - "(1986~95)  PG&E 등 태양광 사업부"
      - "(1996~2007)  PowerLight 사장"
      - "(2007~09)  SunPower Systems 사장"
      - "(2010~13)  Solaria CEO"
      - ""
      - "(2013~)  [[Nextpower CEO]]"
    source: 2026 Proxy Statement
    notes: |
      CEO는 누구일까요?
      (나)
      창업자 댄 슈가는 63세로
      렌셀러 공대에서 전기전자공학을 전공했습니다.
      (나)
      1988년부터 태양광 업계에서 일했고
      파워라이트 사장, 선파워 시스템즈 사장,
      솔라리아 CEO를 거쳤습니다.
      (나)
      2013년부터 넥스트파워를 이끌고 있습니다.

  - title: 경영진
    layout: left
    media_width: 4.0
    image: img/wenger.jpg
    lines:
      - "[[Howard Wenger]]  사장 (66세)"
      - "- SunPower Systems CEO, PowerLight 부사장 출신"
      - "- 슈가와 PowerLight·SunPower에서 20년 넘게 함께 일함"
      - ""
      - "[[Chuck Boynton]]  CFO (58세)"
      - "- 2024년 5월 취임, 이전 Logitech·Poly·SunPower CFO"
    source: 2026 Proxy Statement, 어닝콜
    notes: |
      사장 하워드 웽거는 슈가와
      파워라이트, 선파워 시절부터 함께 일한 동료입니다.
      (나)
      CFO 척 보인턴은 이사회 멤버로 있다가
      2024년 5월 CFO로 합류했습니다.

  - type: segments
    title: 매출 구성
    box_width: 3.9
    segments:
      - name: "1) 트래커 (86%)"
        items: ["NX Horizon", "NX Horizon-XTR (지형 추종형)"]
      - name: "2) 비트래커 (14%)"
        items: ["TrueCapture · eBOS", "기초(Foundations) · 로보틱스"]
      - name: "3) 신사업 (FY27~)"
        items: ["인버터·PCS (Apex/Zigor)", "ESS (Prevalon) · 유럽 고정식"]
    source: Q1 FY27 주주서한
    notes: |
      넥스트파워는 돈을 어떻게 벌까요?
      (나)
      매출의 86%는 아직 트래커입니다.
      (나)
      나머지 14%는 트루캡처 소프트웨어,
      전기 설비인 eBOS, 기초 구조물 같은 비트래커 제품인데
      트래커보다 더 빠르게 성장하고 있습니다.
      (나)
      그리고 이번 회계연도부터
      인버터와 배터리라는 새 사업이 추가됩니다.

  - title: 지역별 매출
    lines:
      - "미국 [[83%]] · 해외 17%  (1년 전 69% : 31%)"
      - "- 해외 매출 YoY {{-40%}}"
    chart:
      categories: ["1Q FY26", "2Q", "3Q", "4Q", "1Q FY27"]
      values: [599, 687, 735, 709, 776]
      labels: ["$5.99억", "$6.87억", "$7.35억", "$7.09억", "$7.76억"]
      top_labels: ["69%", "76%", "81%", "81%", "83%"]
      name: 미국 매출
    source: "Q1 FY27 주주서한 (막대: 미국 매출, 노란 숫자: 미국 비중)"
    notes: |
      지역별로 보면 미국 비중이 83%까지 올라왔습니다.
      1년 전에는 69%였습니다.
      (나)
      반대로 해외 매출은 1년 전보다 40% 줄었습니다.

  - title: 연도별 실적 추이
    charts:
      - {source: annual.revenue, n: 5, title: "매출"}
      - {source: annual.eps_diluted, n: 3, title: "희석 EPS (GAAP)"}
      - {source: annual.fcf, n: 4, title: "잉여현금흐름"}
    source: SEC 10-K (XBRL), 회계연도는 3월 말 결산
    notes: |
      연도별 실적 추이를 보겠습니다.
      넥스트파워 회계연도는 3월에 끝납니다.
      (나)
      매출은 FY22 14.6억 달러에서
      FY26 35.6억 달러로 4년 만에 2.4배가 됐습니다.
      (나)
      희석 EPS는 FY24 3.37달러에서 FY26 3.84달러로 늘었고
      (나)
      잉여현금흐름은 FY25 6.2억, FY26 5.1억 달러를 기록했습니다.

  - title: 주요 주주
    table:
      header: ["주주", "보유 주식", "지분율"]
      rows:
        - ["BlackRock", "20,403,744", "[[13.48%]]"]
        - ["FMR (Fidelity)", "20,240,838", "[[13.37%]]"]
        - ["Dan Shugar (CEO)", "627,532", "1% 미만"]
        - ["이사·임원 전체 (13명)", "1,266,723", "1% 미만"]
      col_widths: [2, 1.3, 1]
      width: 9
      font_size: 18
    source: 2026 Proxy Statement (2026.6.5 기준)
    notes: |
      주요 주주는 누구일까요?
      올해 7월 공개된 위임장 설명서에 따르면
      (나)
      블랙록이 13.48%, 피델리티가 13.37%로
      두 기관이 4분의 1 이상을 갖고 있습니다.
      (나)
      창업자 댄 슈가는 약 63만 주로 1%가 안 되고
      이사와 임원을 다 합쳐도 1% 미만입니다.
      플렉스에서 분사한 회사라 창업자 지분이 작은 편입니다.

  - title: 배당 · 자사주
    lines:
      - "배당:  [[없음]]"
      - "자사주 매입 승인:  [[$5억]] (2026.1)"
      - "- 1분기 매입 없음, 잔여 약 $4.996억"
      - "자본배분 우선순위:  ① 내부 투자  ② M&A  ③ 주주환원"
    image: img/handshake.jpg
    source: 10-Q, 주주서한
    notes: |
      넥스트파워는 배당을 주지 않습니다.
      (나)
      올해 1월 5억 달러 자사주 매입을 승인받았지만
      1분기에는 사지 않았습니다.
      (나)
      회사는 내부 투자, 인수합병, 주주환원 순으로
      돈을 쓰겠다고 밝혔습니다.

  - title: 밸류에이션
    table:
      style: statement
      font_size: 16
      header: ["지표 (주가 $84.30 기준)", "값", "근거"]
      rows:
        - ["Trailing P/E (GAAP)", "[[21.8배]]", "TTM 희석 EPS $3.87"]
        - ["Forward P/E", "[[18.0배]]", "FY27 컨센 EPS $4.68"]
        - ["회사 가이던스 기준 P/E", "18.4배", "조정 EPS 중간값 $4.58"]
        - ["P/S", "3.5배", "TTM 매출 $36.3억"]
        - ["순현금", "$12.1억", "부채 0"]
      col_widths: [2.2, 1, 2]
      width: 10
    source: SEC XBRL, StockAnalysis (2026.10.2), 주주서한
    notes: |
      밸류에이션은 어떨까요?
      (나)
      트레일링 PER은 21.8배,
      컨센서스 EPS 기준 포워드 PER은 18배입니다.
      (나)
      부채 없이 현금이 12억 달러 넘게 있다는 점도
      기억해 둘 만합니다.
      주가가 빠지면서 1년 전보다 부담이 꽤 줄었습니다.

  - title: 목표주가
    lines:
      - "애널리스트 [[29명]]:  강력 매수 19 · 매수 7 · 보유 3 · 매도 0"
      - "평균 목표주가 [[$138.96]]  (현재가 대비 {{+65%}})"
      - "- 최고 $175 · 최저 $70"
    chart:
      categories: ["강력 매수", "매수", "보유", "매도"]
      values: [19, 7, 3, 0]
      labels: ["19명", "7명", "3명", "0명"]
      highlight: [0]
    source: StockAnalysis (2026.10.2)
    notes: |
      목표주가는 얼마일까요?
      10월 2일 기준
      29명의 애널리스트 중 26명이 매수 의견,
      3명이 보유 의견을 냈습니다.
      (나)
      평균 목표주가는 139달러로
      현재 주가보다 65% 높습니다.
      다만 최저 70달러부터 최고 175달러까지 의견이 크게 갈립니다.

  - title: 목표주가 조정
    lines:
      - "Jefferies:  목표가 [[$131]]로 하향 (2026.7.31, 실적 발표 다음날)"
      - "Argus:  목표가 [[$75]]로 하향 (2026.9.30)"
      - "- 인수 이후 마진 희석·가이던스 상단 유지에 대한 우려"
    image: img/datacenter.jpg
    source: Investing.com·BigGo 금융 보도 요약 (원문 리포트 미확인)
    notes: |
      실적 발표 이후 목표가를 낮춘 곳도 있습니다.
      (나)
      제프리스는 7월 31일 목표가를 131달러로 낮췄고
      아르거스는 9월 30일 75달러까지 낮췄습니다.
      인수합병으로 마진이 낮아질 수 있다는 걱정이 반영된 것으로 보입니다.
      (원문 리포트는 확인하지 못했고 보도 내용을 옮겼습니다.)

  - type: section
    text: "FY2027 1분기 실적"
    subtitle: "Nextpower Q1 FY27 · 2026년 4~6월 (7월 30일 발표)"
    notes: |
      그럼 실적이 어떻게 나왔을까요?
      7월 30일에 발표된 1분기 실적을 정리해드리겠습니다.

  - title: FY27 1분기 실적
