      짐머만 실적도 아직 빠져 있습니다.

  - type: section
    text: "Q & A"
    notes: |
      어닝콜 후 경영진과 애널리스트 간의 Q&A 가 있었습니다.
      주요 문답을 정리해드리겠습니다.

  - type: qa
    q: "FCC의 [[수입 인버터 규제]] 발표 이후 인버터 사업 기회가 얼마나 커졌나요? (UBS)"
    a:
      - "2년 전부터 고객들이 가장 힘들어하는 부분이 {{인버터}}라서 준비해 왔습니다."
      - "목표는 업계에서 {{가동률이 가장 높은}} 인버터를 공급하는 것입니다."
      - "고객들은 {{미국산}}, {{사이버보안}}, FEOC 대응을 중요하게 보고 있고"
      - "그래서 지난 분기에 $5,000만 추가 투자를 결정했습니다."
    source: Q1 FY27 어닝콜 (Dan Shugar)
    notes: |
      첫번째 질문입니다.
      미국 연방통신위원회가 수입 인버터 규제를 발표했는데
      인버터 사업 기회가 얼마나 커졌는지 물었습니다.
      (나)
      슈가 CEO는 2년 전부터 준비해 온 사업이고
      가장 안정적으로 돌아가는 인버터를 만들겠다고 답했습니다.

  - type: qa
    q: "잇따른 [[인수]]의 통합 상황과 [[하이퍼스케일러]] 고객 확보는 어떻게 되고 있나요? (Goldman Sachs)"
    a:
      - "eBOS는 인수 5분기 만에 연 {{$1억}} 수준으로, 그 회사 30년 역사의 두 배입니다."
      - "Prevalon과 Zimmermann은 이미 성숙한 회사라 통합 부담이 적습니다."
      - "하이퍼스케일러와는 {{직접}}, 그리고 개발사를 통해 {{간접}}으로 거래하고 있고"
      - "데이터센터 전력 수요는 실제로 있으며 수주가 늘고 있습니다."
    source: Q1 FY27 어닝콜 (Dan Shugar, Howard Wenger)
    notes: |
      두번째 질문은 인수 통합과 하이퍼스케일러였습니다.
      (나)
      회사는 eBOS 사례를 들며 인수 통합 능력을 강조했고
      데이터센터 고객과 직접 거래도 하고 있다고 답했습니다.

  - type: qa
    q: "마진 개선 중 [[TrueCapture]] 기여는 얼마나 되나요? (Roth)"
    a:
      - "TrueCapture는 과거 매출의 {{2%}}였는데 지금은 그보다 높습니다."
      - "다만 이번 마진 초과 달성의 주된 이유는 {{IEEPA 관세 환급}}이었고"
      - "운임 상승이 일부를 상쇄했습니다. 2분기에도 환급이 더 있을 예정입니다."
    source: Q1 FY27 어닝콜 (Chuck Boynton, Howard Wenger)
    notes: |
      세번째 질문은 마진이었습니다.
      (나)
      CFO는 이번 마진 서프라이즈의 주인공은
      트루캡처보다 관세 환급이었다고 솔직하게 답했습니다.
      일회성 요인이 섞여 있다는 뜻입니다.

  - type: qa
    q: "가이던스 [[하단만]] 올리고 상단은 왜 그대로 두었나요? (Wolfe)"
    a:
      - "5월 연간 가이던스 → 6월 Prevalon 반영해 상·하단 상향 → 이번에 하단 상향"
      - "{{Zimmermann}}은 인수 완료 시점이 불확실해 아직 넣지 않았습니다."
      - "하반기에 Zimmermann이 완료되면 올라갈 가능성이 큽니다."
      - "이제 1분기가 끝났을 뿐이라 신중하게 잡았습니다."
    source: Q1 FY27 어닝콜 (Chuck Boynton)
    notes: |
      네번째 질문은 왜 가이던스 상단을 안 올렸냐는 것이었습니다.
      (나)
      CFO는 짐머만이 아직 반영되지 않았고
      1분기만 지났기 때문에 신중하게 잡았다고 답했습니다.

  - type: qa
    q: "[[ESS]] 사업을 키우는 데 공급·설계·자금 측면의 걸림돌은 없나요? (Truist)"
    a:
      - "공급, 설계, 금융 어느 쪽에서도 {{걸림돌은 없다}}고 봅니다."
      - "ESS는 2030년까지 연 {{33%}} 성장이 예상되고, 배터리 사용 시간도 6~8시간으로 길어지고 있습니다."
      - "올해 상반기 미국 신규 발전설비의 {{91%}}가 태양광과 ESS였습니다."
    source: Q1 FY27 어닝콜 (Dan Shugar)
    notes: |
      마지막 질문은 ESS 사업의 걸림돌이었습니다.
      (나)
      슈가 CEO는 걸림돌이 없다고 자신하면서
      올해 상반기 미국에 새로 들어선 발전설비의 91%가
      태양광과 ESS였다고 강조했습니다.

