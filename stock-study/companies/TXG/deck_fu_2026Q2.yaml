    notes: |
      분기별로 보면,
      3분기 매출은 Atera를 기다리는 고객들 때문에
      2분기보다 200만 달러 정도 줄어든 1억 4,900만 달러 수준이 예상됩니다.
      그리고 4분기에는 Atera 출하가 본격화되면서
      연간 가이던스 중간값 기준 1억 6,900만 달러로
      13% 정도 뛰어오를 전망입니다.
      매출총이익률은 네 분기 연속 개선됐습니다.

  - type: section
    text: "Q & A"
    notes: |
      어닝콜 후 경영진과 애널리스트 간에 Q&A가 있었습니다.
      주요 문답을 정리해드리겠습니다.

  - type: qa
    q: "Atera [[수요]]가 이렇게 강한데, 하반기 출하 목표(40대)는 왜 보수적으로 유지하나요? (Canaccord)"
    a:
      - "수요는 정말 엄청나고, 수요가 제약이 아닙니다."
      - "제약은 하반기에 출하할 수 있도록 {{생산능력}}을 옮기는 것입니다."
      - "지난 분기에 말씀드린 대로 {{40대}} 출하는 그대로 예상합니다."
    source: "2026-2분기 어닝콜 (Serge Saxonov)"
    notes: |
      첫번째 질문은 Atera 출하 목표가 왜 그대로냐는 것이었습니다.
      CEO는 수요가 아니라 생산능력이 문제라고 답했습니다.

  - type: qa
    q: "기존에는 3분기 매출이 2분기와 비슷하다고 했는데, 이제 [[소폭 감소]]라고 하는 이유는요? (Barclays)"
    a:
      - "바뀐 것은 없습니다. 3분기는 공간 분석 제품의 {{전환이 정점}}인 시기입니다."
      - "Atera를 기다리는 고객들 때문에 2분기보다 {{200만 달러 정도}} 줄어들 것입니다."
      - "4분기 증가분은 거의 전부 {{Atera 장비}} 매출로 설명되고, Atera 소모품은 아직 반영하지 않았습니다."
    source: "2026-2분기 어닝콜 (Adam Taich, CFO)"
    notes: |
      두번째는 3분기 매출 감소 이유였습니다.
      CFO는 Atera로 넘어가는 전환기라
      3분기에 잠시 매출이 줄지만
      4분기에는 Atera 장비만으로도 크게 늘어난다고 설명했습니다.

  - type: qa
    q: "내년 Atera [[생산능력]]은 얼마나 빨리 늘릴 수 있고, 장비당 [[소모품 매출]]은 어느 정도인가요? (Jefferies)"
    a:
      - "내년 이후에도 생산능력을 계속 늘릴 것이며, 그동안 쌓은 공급망 역량을 총동원하겠습니다."
      - "장비를 최대로 쓰면 소모품 매출이 연 {{$150만~300만}} 정도로 Xenium의 약 {{2배}}입니다."
    source: "2026-2분기 어닝콜 (Serge Saxonov)"
    notes: |
      세번째는 생산능력과 소모품 매출이었습니다.
      장비 한 대를 최대로 쓰면
      1년에 소모품 매출이 150만에서 300만 달러로
      Xenium의 두 배 정도라고 합니다.

  - type: qa
    q: "단일세포(Chromium) 소모품 매출이 정체된 이유와 [[AI 수요]]의 실제 규모는요? (Bank of America)"
    a:
      - "가장 큰 요인은 {{Flex Apex}}로의 전환이고, 사용량(반응 건수)은 꾸준하고 강하게 늘고 있습니다."
      - "그 성장의 상당 부분은 {{AI 응용}}과 대규모 코호트 실험에서 나옵니다."
      - "참고로 Chromium 장비는 전체 매출의 약 {{2%}}에 불과합니다."
    source: "2026-2분기 어닝콜 (Serge Saxonov, Adam Taich)"
    notes: |
      네번째는 단일세포 사업과 AI 수요였습니다.
      CEO는 신제품 Flex Apex로 넘어가는 과정이라
      매출이 잠시 주춤하지만 사용량은 크게 늘고 있고,
      그 상당 부분이 AI 연구에서 나온다고 답했습니다.

  - type: qa
    q: "학계 [[연구비]] 집행은 개선되고 있나요? 가이던스의 추가 상승 여지가 될까요? (J.P. Morgan)"
    a:
      - "분위기는 조금 나아졌지만 환경은 여전히 {{불안정}}하고, 실제 구매로는 아직 이어지지 않습니다."
      - "가이던스는 지금 환경이 {{그대로 유지}}된다고 가정했습니다."
    source: "2026-2분기 어닝콜 (Serge Saxonov, Adam Taich)"
    notes: |
      다섯번째는 학계 연구비 상황이었습니다.
      아직 돈이 실제 구매로 이어지지 않고 있고
      가이던스에는 개선을 반영하지 않았다고 답했습니다.

  - type: qa
    q: "Atera가 기존 [[Xenium·Visium]] 매출을 얼마나 잠식할까요? (TD Cowen)"
    a:
      - "Xenium과 Visium 판매가 이미 일부 줄고 있고, 앞으로 더 줄 것입니다."
      - "하지만 {{Atera 수요가 그 감소분을 충분히 메우고도 남을 것}}입니다."
      - "Atera 공개 이후에도 Xenium·Visium 소모품은 {{전분기 대비 성장}}했습니다."
    source: "2026-2분기 어닝콜 (Serge Saxonov, Adam Taich)"
    notes: |
      마지막은 Atera가 기존 제품을 잠식하는 문제였습니다.
      회사는 잠식이 있지만
      Atera 수요가 이를 충분히 메울 것이라고 자신했습니다.

